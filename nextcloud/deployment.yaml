apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nextcloud
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: nextcloud
    spec:
      hostname: nextcloud
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      # The data PVC root is root-owned; fsGroup only grants group access. Nextcloud's
      # occ refuses to run unless the data dir is 0770 and chmods it itself, which
      # fails for www-data when it isn't the owner ("Environment not properly prepared").
      initContainers:
        - name: data-permissions
          image: nextcloud:34.0.4-apache
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -euc
            - chown 33:33 /var/www/data && chmod 2770 /var/www/data
          volumeMounts:
            - mountPath: /var/www/data
              name: data
      containers:
        - name: nextcloud
          image: nextcloud:34.0.4-apache
          imagePullPolicy: IfNotPresent
          env: &nextcloud-env
            - name: POSTGRES_HOST
              value: pg01.db.gewis.nl:5432
            - name: POSTGRES_DB
              value: nextcloudtest_db
            - name: POSTGRES_USER
              value: svc-nextcloud-test
            - name: PGSSLMODE
              value: require
            - name: PGSSLCERT
              value: /tmp/postgresql.crt
            - name: NEXTCLOUD_ADMIN_USER
              value: cbclocal
            - name: NEXTCLOUD_DATA_DIR
              value: /var/www/data
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.test.gewis.nl
            - name: NEXTCLOUD_INIT_HTACCESS
              value: 'true'
            - name: OVERWRITEHOST
              value: nextcloud.test.gewis.nl
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.test.gewis.nl
            - name: TRUSTED_PROXIES
              value: 10.0.0.0/8
            - name: APACHE_DISABLE_REWRITE_IP
              value: '1'
            - name: APACHE_BODY_LIMIT
              value: '0'
            - name: PHP_MEMORY_LIMIT
              value: 1G
            - name: PHP_UPLOAD_LIMIT
              value: 16G
            - name: PHP_OPCACHE_MEMORY_CONSUMPTION
              value: '256'
            - name: REDIS_HOST
              value: redis
            - name: TZ
              value: Europe/Amsterdam
          envFrom: &nextcloud-secrets
            - secretRef:
                name: nextcloud-secrets
          ports:
            - containerPort: 80
              name: main
              protocol: TCP
          startupProbe:
            httpGet:
              path: /status.php
              port: main
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: main
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status.php
              port: main
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /var/www/html
              name: html
            - mountPath: /var/www/data
              name: data
            - mountPath: /docker-entrypoint-hooks.d/before-starting
              name: hooks
        - name: cron
          image: nextcloud:34.0.4-apache
          imagePullPolicy: IfNotPresent
          command:
            - /cron.sh
          env: *nextcloud-env
          envFrom: *nextcloud-secrets
          volumeMounts:
            - mountPath: /var/www/html
              name: html
            - mountPath: /var/www/data
              name: data
        # Gives every FILES-datas-<share>-RO/-RW group pair (created by user_oidc on
        # login) a team folder.
        - name: team-folders
          image: nextcloud:34.0.4-apache
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -uc
            - |
              trap 'exit 0' TERM
              while :; do
                /scripts/team-folders.sh || echo '==> team folder reconcile failed'
                sleep 60 &
                wait $!
              done
          # occ must run as the owner of config/config.php.
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          env: *nextcloud-env
          envFrom: *nextcloud-secrets
          volumeMounts:
            - mountPath: /var/www/html
              name: html
            - mountPath: /var/www/data
              name: data
            - mountPath: /scripts
              name: scripts
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: html
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: hooks
          configMap:
            name: nextcloud-hooks
            defaultMode: 0755
        - name: scripts
          configMap:
            name: nextcloud-scripts
            defaultMode: 0755
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  template:
    metadata:
      labels:
        io.kompose.service: redis
    spec:
      containers:
        - name: redis
          image: redis:8.6-alpine
          imagePullPolicy: IfNotPresent
          # Cache + file locks only, no persistence: losing it on restart is safe.
          args:
            - sh
            - -euc
            - |
              echo "requirepass '$REDIS_PASSWORD'" > /etc/redis.conf
              exec redis-server /etc/redis.conf
          envFrom:
            - secretRef:
                name: nextcloud-secrets
          ports:
            - containerPort: 6379
              name: 6379tcp
              protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
spec:
  # Every user editing a document must reach the same coolwsd;
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: collabora
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: collabora
    spec:
      # coolwsd saves open documents back to Nextcloud on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: collabora
          image: collabora/code:26.04.4.2.1
          imagePullPolicy: IfNotPresent
          env:
            - name: aliasgroup1
              value: https://nextcloud.test.gewis.nl:443,http://nextcloud:80
            # Served on the Nextcloud host through the path routes in ingress.yaml.
            - name: server_name
              value: nextcloud.test.gewis.nl
            - name: extra_params
              value: --o:ssl.enable=false --o:ssl.termination=true
            - name: dictionaries
              value: nl en_GB
          ports:
            - containerPort: 9980
              name: main
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: main
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: main
            failureThreshold: 2
            periodSeconds: 10
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /
              port: main
            failureThreshold: 4
            periodSeconds: 10
            timeoutSeconds: 30
