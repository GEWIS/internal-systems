apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - secrets.yaml

# Generated (hash-suffixed) so a hook change rolls the Deployment; a plain ConfigMap
# update never restarts the pod, so before-starting hooks would not re-run.
configMapGenerator:
  - name: nextcloud-hooks
    files:
      - hooks/10-configure.sh
