apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mattermost
  namespace: mattermost-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mattermost.gewis.nl`)
      kind: Rule
      services:
        - name: mattermost
          port: 8065
    # Native mobile app login through the mattermost-oidc plugin; see mobile-bridge in deployment.yaml.
    - match: Host(`mattermost.gewis.nl`) && (Path(`/api/v4/config/client`) || Path(`/oauth/openid/mobile_login`))
      kind: Rule
      services:
        - name: mobile-bridge
          port: 8066
