apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mattermost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mattermost
    spec:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      # Team Edition has no SSO; the mattermost-oidc plugin adds Keycloak login. On every start
      # Mattermost wipes its local plugin dirs and reinstalls the bundles from <data>/plugins/,
      # so placing the pinned bundle there is all it takes to install or upgrade it.
      # The plugin only discovers Keycloak when it activates and never retries, so Mattermost
      # must not start while Keycloak is unreachable.
      initContainers:
        - name: oidc-plugin
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
          command:
            - sh
            - -euc
            - |
              bundle=/mattermost/data/plugins/mattermost-oidc.tar.gz
              mkdir -p "${bundle%/*}"
              if ! { [ -f "$bundle" ] && echo "$PLUGIN_SHA256  $bundle" | sha256sum -c -s; }; then
                curl -fsSL -o "$bundle.tmp" "$PLUGIN_URL"
                echo "$PLUGIN_SHA256  $bundle.tmp" | sha256sum -c -
                mv "$bundle.tmp" "$bundle"
              fi
              until curl -fsS -o /dev/null "$OIDC_ISSUER/.well-known/openid-configuration"; do
                echo "==> waiting for $OIDC_ISSUER"
                sleep 5
              done
          env:
            - name: PLUGIN_URL
              value: https://github.com/server-camp/mattermost-oidc-plugin/releases/download/v0.6.1/mattermost-oidc-0.6.1.tar.gz
            - name: PLUGIN_SHA256
              value: 7e5b83cb9d6fcfd8ec3e8230b25c6b1be29f810ac1b3157b7641b7c2d64808c1
            # Must match IssuerURL in MM_PLUGINSETTINGS_PLUGINS below.
            - name: OIDC_ISSUER
              value: https://auth.gewis.nl/realms/GEWISWG
          volumeMounts:
            - mountPath: /mattermost/data
              name: data
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:11.11.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mattermost-secrets
          env:
            - name: TZ
              value: Europe/Amsterdam
            # Keep the config in the database, so no config volume is needed.
            - name: MM_CONFIG
              value: $(MM_SQLSETTINGS_DATASOURCE)
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://mattermost.gewis.nl
            - name: MM_SERVICESETTINGS_TRUSTEDPROXYIPHEADER
              value: X-Forwarded-For X-Real-IP
            - name: MM_LOGSETTINGS_ENABLEFILE
              value: 'false'
            - name: MM_LOGSETTINGS_ENABLEDIAGNOSTICS
              value: 'false'
            - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
              value: 'true'
            - name: MM_EMAILSETTINGS_SMTPSERVER
              value: smtp.gewis.nl
            - name: MM_EMAILSETTINGS_SMTPPORT
              value: '587'
            - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
              value: STARTTLS
            - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
              value: 'true'
            - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
              value: svc-mattermost-prod@gewis.nl
            - name: MM_EMAILSETTINGS_FEEDBACKNAME
              value: GEWIS Mattermost
            # Accounts only come from Keycloak; the plugin creates them on first login.
            - name: MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL
              value: 'false'
            # Replaces all plugin states: Playbooks needs a Professional licence, Calls needs
            # UDP 8443 exposed and AI needs an LLM backend.
            - name: MM_PLUGINSETTINGS_PLUGINSTATES
              value: >-
                {"mattermost-oidc": {"Enable": true}, "playbooks": {"Enable": false},
                "com.mattermost.calls": {"Enable": false}, "mattermost-ai": {"Enable": false},
                "com.mattermost.nps": {"Enable": false}}
            # Replaces all plugin settings; unset keys fall back to Go zero values, not plugin defaults.
            - name: MM_PLUGINSETTINGS_PLUGINS
              value: >-
                {"mattermost-oidc": {"Enable": true,
                "IssuerURL": "https://auth.gewis.nl/realms/GEWISWG",
                "ClientID": "mattermost-prod", "ClientSecret": "$(OIDC_CLIENT_SECRET)",
                "Scopes": "openid profile email", "ButtonText": "Log in with GEWIS",
                "ButtonColor": "#0058CC", "UsernameClaim": "preferred_username",
                "EmailClaim": "email", "FirstNameClaim": "given_name",
                "LastNameClaim": "family_name", "PositionClaim": "",
                "EmailVerifiedClaim": "email_verified", "RequireEmailVerified": false,
                "AutoCreateAccounts": true, "AutoLinkByEmail": false, "DefaultTeam": ""}}
          ports:
            - containerPort: 8065
              name: main
              protocol: TCP
          # The first start runs all database migrations.
          startupProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /mattermost/data
              name: data
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
