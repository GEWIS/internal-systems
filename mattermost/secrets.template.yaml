apiVersion: v1
kind: Secret
metadata:
  name: mattermost-secrets
  namespace: mattermost-prod
type: Opaque
stringData:
  # postgres://svc-mattermost-prod:<password>@pg01.db.gewis.nl:5432/mattermostprod_db?sslmode=require&connect_timeout=10
  MM_SQLSETTINGS_DATASOURCE: REPLACE_ME
  MM_EMAILSETTINGS_SMTPUSERNAME: REPLACE_ME
  MM_EMAILSETTINGS_SMTPPASSWORD: REPLACE_ME
  # Keycloak client secret of mattermost-prod; embedded in the plugin settings JSON, so no " or \.
  OIDC_CLIENT_SECRET: REPLACE_ME
