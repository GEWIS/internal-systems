metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: keycloak-secrets
  namespace: keycloak-prod
spec:
  encryptedData:
    KC_BOOTSTRAP_ADMIN_PASSWORD: 
    KC_BOOTSTRAP_ADMIN_USERNAME: 
    KC_DB_PASSWORD: 
    KC_DB_USERNAME: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: keycloak-secrets
      namespace: keycloak-prod
    type: Opaque
